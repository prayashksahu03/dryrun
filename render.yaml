# Render blueprint — deploys the DryRun backend (FastAPI + interpreter + tutor).
# Frontend goes on Vercel/Netlify separately (see DEPLOY.md).
services:
  - type: web
    name: dryrun-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: EXPLAIN_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: EXPLAIN_MODEL
        value: allam-2-7b              # CURRENT non-reasoning Groq model (fast, clean). Groq rotates models —
                                       # verify/swap at console.groq.com/docs/models; avoid reasoning models
                                       # (they emit <think> and burn the token budget before answering).
      - key: EXPLAIN_API_KEY
        sync: false          # secret — set this in the Render dashboard, not in git
