# Render blueprint — deploys the DryRun backend (FastAPI + interpreter + tutor).
# Frontend goes on Vercel/Netlify separately (see DEPLOY.md).
services:
  - type: web
    name: dryrun-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: EXPLAIN_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: EXPLAIN_MODEL
        value: openai/gpt-oss-120b     # strong open-weight model (deep questions). Groq rotates models —
                                       # verify/swap at console.groq.com/docs/models.
      - key: EXPLAIN_REASONING
        value: hidden                  # suppress <think> traces from reasoning models (Groq param).
                                       # Leave unset for non-reasoning models / local Ollama.
      - key: EXPLAIN_API_KEY
        sync: false          # secret — set this in the Render dashboard, not in git
